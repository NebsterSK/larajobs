</head>

<body>
<div x-data="" x-init="initTheme" class="container">
    <div x-on:click="toggleTheme" id="themeToggler" class="d-inline-block position-absolute lead px-2 py-1" title="Toggle Light / Dark mode">
        <i class="fa-solid fa-circle-half-stroke"></i>
    </div>

    <h1 class="text-center mt-5">Laravel companies in Slovakia</h1>

    <p class="text-center">If you are looking for a job in a company that uses Laravel, you are in the right place!<br>Feel free to contact any company from the list below.</p>

    <p class="text-center">Last updated: 13.9.2025</p>

    <div class="row justify-content-lg-center">
        <div
            x-data="{search:'', companies:data}"

            class="col-12 col-lg-4"
        >
            <div class="my-5">
                <label for="searchInput" class="d-none">Search</label>

                <input
                    x-model="search"
                    @keyup="companies = filter(search)"

                    type="text"
                    class="form-control"
                    id="searchInput"
                    maxlength="255"
                    placeholder="Search"
                >
            </div>

            <ul class="list-group mb-5">
                <template
                    x-for="company in companies"
                    :key="company.name"
                >
                    <li class="list-group-item">
                        <p
                            x-text="company.name"

                            class="fw-bold mb-1"
                        ></p>

                        <a
                            :href="company.url"
                            x-text="company.url"

                            target="_blank"
                        ></a>
                    </li>
                </template>
            </ul>
        </div>
    </div>

    <p class="text-center">Sources: <a href="https://profesia.sk" target="_blank">profesia.sk</a>, <a href="https://pretlak.sk" target="_blank">pretlak.sk</a>, <a href="https://linkedin.com" target="_blank">linkedin.com</a></p>

    <p class="text-center text-secondary"><a href="https://www.linkedin.com/in/lukas-neuschl/" target="_blank">Lukáš Neuschl</a> &copy; 2025, built with <a href="https://alpinejs.dev/" target="_blank">Alpine.js</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
<script>
    // Properties
    let theme = localStorage.theme !== undefined ? localStorage.theme : 'dark';

    const data = [
        { name: "Amcef", url: "https://amcef.com/" },
        { name: "Apartment Holdings", url: "https://apartmentholdings.sk/" },
        { name: "ASdata", url: "https://asdata.sk/" },
        { name: "Barani Design Technologies", url: "https://baranidesign.com/" },
        { name: "Berlin Brands Group", url: "https://berlin-brands-group.com/sk/workplaces/slovakia" },
        { name: "Boutaround", url: "https://boataround.com/" },
        { name: "Brackets", url: "https://meetbrackets.com/" },
        { name: "Bratislava Karlova Ves", url: "https://karlovaves.sk/" },
        { name: "Bratislava Petržalka", url: "https://petrzalka.sk/" },
        { name: "Brokeria", url: "https://brokeria.sk/" },
        { name: "Commander Services", url: "https://commander.sk/" },
        { name: "Confer", url: "https://www.confer.shop/sk/" },
        { name: "DataConcept", url: "https://dataconcept.digital/" },
        { name: "Dazzler", url: "https://dazzler.sk/" },
        { name: "DeMi Studio", url: "https://www.demi.sk/" },
        { name: "DIGI Slovakia", url: "https://digislovakia.sk/" },

        { name: "ESET", url: "https://eset.com/" },

        { name: "Flywize", url: "https://flywize.eu/" },

        { name: "Kodiva", url: "https://kodiva.sk/" },

        { name: "Matate", url: "https://matate.sk/" },
        { name: "Nike", url: "https://nike.sk/" },

        { name: "Positive", url: "https://positive.sk/" },

        { name: "Wink & Nod", url: "https://www.winknod.sk/" },
        { name: "World Business Press Online", url: "https://wbpo.sk/" }
    ];

    // Function definitions
    function toggleTheme()
    {
        if (theme === 'light') {
            document.documentElement.classList.add('dark');
            localStorage.theme = theme = 'dark';
        } else {
            document.documentElement.classList.remove('dark');
            localStorage.theme = theme = 'light';
        }
    }

    function initTheme()
    {
        if (theme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    }

    function filter(search)
    {
        return data.filter((item) => item.name.toLowerCase().includes(search.toLowerCase()));
    }

    // Function calls
    mixpanel.init("43874bd6d44dc17060ba954cc58c2154", {
        debug: false,
        track_pageview: true,
        persistence: "localStorage",
    });
</script>
</body>
</html>
